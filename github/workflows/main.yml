name: Hai Phong Deal Hunter Bot

on:
  schedule:
    # Chạy tự động lúc 08:00 sáng (01:00 UTC) và 17:00 chiều (10:00 UTC) giờ Việt Nam
    - cron: '0 1,10 * * *'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công ngay trên giao diện điện thoại/web

permissions:
  contents: write # Cấp quyền ghi để bot tự động commit và push file sent_deals.json

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn từ Repository
        uses: actions/checkout@v4

      - name: 2. Cài đặt môi trường Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Cài đặt các thư viện cần thiết
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Chạy script săn deal và bắn thông báo Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: 5. Tự động cập nhật sent_deals.json lên Repository (Chống gửi trùng)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_deals.json
          git diff --staged --quiet || (git commit -m "chore: update sent_deals.json [skip ci]" && git push)
